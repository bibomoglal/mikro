name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: Allow HTTP to the router
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          grep -n usesCleartextTraffic android/app/src/main/AndroidManifest.xml
      - name: Add native downloader (saves PDF straight to Downloads)
        run: |
          D=android/app/src/main/java/io/github/bibomoglal/brightstar
          ls "$D"
          cp native/DownloaderPlugin.java native/MainActivity.java "$D"/
      - name: Storage permissions (archive + PDF in Documents)
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <application android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml
          grep -n "STORAGE\|requestLegacy" android/app/src/main/AndroidManifest.xml
      - name: Set app icon
        run: |
          pip install pillow
          python3 make_icons.py
          find android/app/src/main/res -name "ic_launcher*"
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BrightStar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
